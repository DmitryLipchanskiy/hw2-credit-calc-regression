name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    env:
      # One browser location for both operating systems — see the cache step below.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Pins a known interpreter on both legs. The name of the executable differs
      # per OS (`python3` on macOS, `python` on Windows), so nothing in this file
      # or in package.json calls either name directly: scripts/python.mjs probes
      # for whichever exists. Hard-coding `python3` cost a whole session on the
      # previous assignment — CLAUDE.md rule 3 exists because of it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show tool versions
        run: node --version
        shell: bash

      - name: Install dependencies
        run: npm ci

      # The browser cache is keyed by the Playwright version, not by the lockfile
      # hash: a browser build belongs to a Playwright release, and any other npm
      # dependency changing must not invalidate a ~200 MB download.
      - name: Resolve Playwright version
        id: pw
        shell: bash
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # PLAYWRIGHT_BROWSERS_PATH points at a directory inside the workspace, so the
      # cache path is one literal string on both operating systems. The default
      # locations differ (~/Library/Caches on macOS, %LOCALAPPDATA% on Windows) and
      # a `~` in an actions/cache path is not reliably expanded on Windows — that
      # is exactly the kind of per-OS divergence this project keeps tripping over.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: .pw-browsers
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      # chromium only: the e2e project runs in one browser, and pulling three
      # would double the matrix for nothing.
      #
      # No --with-deps: that flag installs system libraries through apt and is
      # Linux-only. This matrix is macOS + Windows, where it is unneeded and would
      # fail — stacking a second breakage on top of the one this step fixes.
      #
      # Run unconditionally rather than gated on a cache hit: with the browser
      # already present the command exits in about a second, and a partially
      # restored cache still gets repaired instead of failing at test time.
      - name: Install Chromium
        run: npx playwright install chromium

      - name: Lint
        run: npm run lint

      - name: Forbidden patterns (CLAUDE.md 4.5)
        run: npm run lint:forbidden

      - name: Type check
        run: npx tsc --noEmit

      - name: Run the regression suite
        run: npm test

      # Cross-check: the same 290 cases through the TypeScript core and through
      # the independent Python reference. Divergence of a single kopeck fails the job.
      - name: Build core
        run: npm run build

      - name: Python reference
        run: npm run oracle:py

      - name: TypeScript side
        run: npm run oracle:ts

      - name: Compare TS against the Python oracle
        run: npm run oracle:compare

      # A green job whose Python half silently skipped looks exactly like a green
      # job where it ran. This step reads the artefacts and fails on any zero:
      # zero cases compared, zero tests run, a skipped test, a missing interpreter.
      # The numbers land in the job summary, so the evidence is visible without
      # expanding a single step.
      - name: Evidence check
        run: npm run ci:evidence

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7
